<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>الذاكرين</title>
    <script>
      (function () {
        var base = "/Islamic/";
        var path = window.location.pathname.indexOf(base) === 0 ? window.location.pathname.slice(base.length) : "";
        window.location.replace(base + "?route=" + encodeURIComponent(path + window.location.search + window.location.hash));
      })();
    </script>
  </head>
  <body></body>
</html>
