name: Format session branch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/arena/01a0e896-islamic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0e896-islamic
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
      - run: dart format .
      - name: Commit formatting on session branch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style: normalize Dart formatting for CI gate'
            git push origin HEAD:arena/01a0e896-islamic
          fi
