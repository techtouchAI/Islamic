name: Android Build and Quality Checks

on:
  push:
    branches: [main, "feat/**", "fix/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: pip3 install Pillow

      - name: Update App Resources from CMS
        run: python3 scripts/update_resources.py

      - name: Verify bundled search databases
        run: python3 scripts/verify_search_databases.py

      # The app's Hijri date comes from this table; a build must never carry a
      # month start that differs from the office of al-Sistani.
      - name: Verify bundled Hijri calendar
        run: python3 scripts/verify_hijri_calendar.py

      - name: Install dependencies
        run: |
          set +e
          flutter --version
          flutter pub get 2>&1 | tee flutter-pub.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            diagnostic=$(tail -n 20 flutter-pub.log | tr '\r\n' '  ' | tail -c 1700)
            echo "::error title=Flutter pub get::$diagnostic"
          fi
          exit "$result"

      - name: Format Dart sources
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart sources
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee flutter-analyze.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            diagnostic=$(grep -E 'error •|warning •|Error:|error - ' flutter-analyze.log | head -c 1800)
            echo "::error title=Flutter analyzer::$diagnostic"
          fi
          exit "$result"

      - name: Run tests
        run: |
          set +e
          flutter test --no-pub --reporter expanded 2>&1 | tee flutter-test.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo '### Flutter test failures' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tr '\r' '\n' < flutter-test.log | tail -n 120 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -n -E -A 10 -B 1 'Expected:|Actual:|\[E\]|Exception|FAILED|Some tests failed' flutter-test.log \
              | tr '\r\n' '  ' | tail -c 1800 > flutter-failures.txt || true
            diagnostic=$(cat flutter-failures.txt)
            echo "::error title=Flutter test failure::$diagnostic"
          fi
          exit "$result"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: flutter-test.log
          if-no-files-found: ignore

      - name: Build web
        run: flutter build web --release

      # Do NOT pass --build-number here: the build number must come from
      # pubspec.yaml so test APKs match the published release numbering.
      # (Using github.run_number made installed apps look newer than the
      # latest release: 885 vs 806.)
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols
        env:
          KEYSTORE_STOREPASS: ${{ secrets.KEYSTORE_STOREPASS }}
          KEYSTORE_KEYPASS: ${{ secrets.KEYSTORE_KEYPASS }}

      # The packaged copy decides what the installed app shows, so the APK
      # itself is checked, not only the source document.
      - name: Verify the calendar inside the APK
        run: |
          python3 scripts/verify_apk_calendar.py \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aldhakereen-apks
          path: build/app/outputs/flutter-apk/*.apk
