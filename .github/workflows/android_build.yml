name: Android Build and Quality Checks

on:
  push:
    branches: [main, "feat/**", "fix/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: pip3 install Pillow

      - name: Update App Resources from CMS
        run: python3 scripts/update_resources.py

      - name: Verify bundled search databases
        run: python3 scripts/verify_search_databases.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: |
          set +e
          flutter test --no-pub --reporter expanded 2>&1 | tee flutter-test.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo '### Flutter test failures' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tr '\r' '\n' < flutter-test.log | tail -n 120 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -n -E -A 10 -B 1 'Expected:|Actual:|\[E\]|Exception|FAILED|Some tests failed' flutter-test.log \
              | tr '\r\n' '  ' | tail -c 1800 > flutter-failures.txt || true
            diagnostic=$(cat flutter-failures.txt)
            echo "::error title=Flutter test failure::$diagnostic"
          fi
          exit "$result"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: flutter-test.log
          if-no-files-found: ignore

      - name: Build web
        run: flutter build web --release

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols --build-number=${{ github.run_number }}
        env:
          KEYSTORE_STOREPASS: ${{ secrets.KEYSTORE_STOREPASS }}
          KEYSTORE_KEYPASS: ${{ secrets.KEYSTORE_KEYPASS }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aldhakereen-apks
          path: build/app/outputs/flutter-apk/*.apk
