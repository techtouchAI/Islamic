name: Android Build and Quality Checks

on:
  push:
    branches: [main, "feat/**", "fix/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: pip3 install Pillow

      - name: Update App Resources from CMS
        run: python3 scripts/update_resources.py

      - name: Verify bundled search databases
        run: python3 scripts/verify_search_databases.py

      - name: Install dependencies
        run: |
          set +e
          flutter --version
          flutter pub get 2>&1 | tee flutter-pub.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            diagnostic=$(tail -n 20 flutter-pub.log | tr '\r\n' '  ' | tail -c 1700)
            echo "::error title=Flutter pub get::$diagnostic"
          fi
          exit "$result"

      - name: Bootstrap installer dependency and formatting
        if: github.head_ref == 'arena/01a0e896-islamic' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          dart format .
          if ! git diff --quiet -- '*.dart' pubspec.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u -- '*.dart' pubspec.lock
            git commit -m 'style: format and lock in-app installer'
            git push origin HEAD:arena/01a0e896-islamic
          fi

      - name: Format Dart sources
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart sources
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee flutter-analyze.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            diagnostic=$(grep -E 'error •|warning •|Error:|error - ' flutter-analyze.log | head -c 1800)
            echo "::error title=Flutter analyzer::$diagnostic"
          fi
          exit "$result"

      - name: Run tests
        run: |
          set +e
          flutter test --no-pub --reporter expanded 2>&1 | tee flutter-test.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo '### Flutter test failures' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tr '\r' '\n' < flutter-test.log | tail -n 120 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -n -E -A 10 -B 1 'Expected:|Actual:|\[E\]|Exception|FAILED|Some tests failed' flutter-test.log \
              | tr '\r\n' '  ' | tail -c 1800 > flutter-failures.txt || true
            diagnostic=$(cat flutter-failures.txt)
            echo "::error title=Flutter test failure::$diagnostic"
          fi
          exit "$result"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: flutter-test.log
          if-no-files-found: ignore

      - name: Build web
        run: flutter build web --release

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols --build-number=${{ github.run_number }}
        env:
          KEYSTORE_STOREPASS: ${{ secrets.KEYSTORE_STOREPASS }}
          KEYSTORE_KEYPASS: ${{ secrets.KEYSTORE_KEYPASS }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aldhakereen-apks
          path: build/app/outputs/flutter-apk/*.apk
