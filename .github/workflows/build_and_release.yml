name: Build and Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION | cut -d '+' -f 1)
          VERSION_CODE=$(echo $VERSION | cut -d '+' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip3 install Pillow

      - name: Update App Resources from CMS (Icons & Audio)
        run: python3 scripts/update_resources.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (with Obfuscation)
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
        env:
          KEYSTORE_STOREPASS: ${{ secrets.KEYSTORE_STOREPASS }}
          KEYSTORE_KEYPASS: ${{ secrets.KEYSTORE_KEYPASS }}

      # التعديل الجوهري هنا: حساب البصمة وتحديث الملف بعد بناء الـ APK
      - name: Calculate Checksum and Update content.json
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          
          # استخراج بصمة الأمان SHA-256
          CHECKSUM=$(sha256sum $APK_PATH | awk '{print $1}')
          
          # بناء رابط التحميل المباشر
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}/app-release.apk"

          # تحديث الملف مع إضافة الحقول الجديدة (checksum و release_notes)
          jq --arg vc "${{ env.VERSION_CODE }}" \
             --arg url "$DOWNLOAD_URL" \
             --arg chk "$CHECKSUM" \
             --arg rn "نسخة جديدة من التطبيق متوفرة. يرجى التحديث للحصول على أفضل تجربة." \
            '.settings.latest_version_code = ($vc | tonumber) | .settings.update_url = $url | .settings.checksum = $chk | .settings.release_notes = $rn | .settings.force_update = true' \
            assets/data/content.json > assets/data/content_tmp.json

          mv assets/data/content_tmp.json assets/data/content.json

      - name: Create Release and Upload APK
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
          tag_name: v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          generate_release_notes: true

      - name: Commit Updated content.json to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/content.json
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update content.json with latest version ${{ env.VERSION_CODE }} (force update)"
            git push origin HEAD:main
          else
            echo "No changes to commit in content.json"
          fi
