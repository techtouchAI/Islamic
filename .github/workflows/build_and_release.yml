name: Build and Release APK

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags like v1.0.0

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Python dependencies
        run: pip3 install Pillow

      - name: Update App Resources from CMS (Icons & Audio)
        run: python3 scripts/update_resources.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (with Obfuscation)
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
        env:
          KEYSTORE_STOREPASS: ${{ secrets.KEYSTORE_STOREPASS }}
          KEYSTORE_KEYPASS: ${{ secrets.KEYSTORE_KEYPASS }}

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')
          VERSION_CODE=$(echo $VERSION | cut -d '+' -f 2)
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Release and Upload APK
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

      - name: Update content.json
        run: |
          # Fetch the direct download URL for the uploaded APK
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk"

          # Use python to update the JSON
          cat << 'PYEOF' > update_json.py
          import json
          import sys

          version_code = int(sys.argv[1])
          download_url = sys.argv[2]

          with open('assets/data/content.json', 'r') as f:
              data = json.load(f)

          if 'settings' not in data:
              data['settings'] = {}

          data['settings']['latest_version_code'] = version_code
          data['settings']['update_url'] = download_url

          with open('assets/data/content.json', 'w') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PYEOF

          python3 update_json.py ${{ env.VERSION_CODE }} "$DOWNLOAD_URL"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/content.json
          git commit -m "chore: auto-update content.json with latest version $VERSION_CODE"

          # Push back to main branch
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin HEAD:main
