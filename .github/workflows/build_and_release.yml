name: Build and Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'assets/audio/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo "$VERSION" | cut -d '+' -f 1)
          VERSION_CODE=$(echo "$VERSION" | cut -d '+' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: pip3 install Pillow

      - name: Update App Resources from CMS
        run: python3 scripts/update_resources.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" > base64_keystore.txt
          base64 -d -i base64_keystore.txt > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "Error: Keystore file is empty or failed to decode!"
            exit 1
          fi
          rm base64_keystore.txt

      - name: Generate key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_STOREPASS }}
          keyPassword=${{ secrets.KEYSTORE_KEYPASS }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols
        env:
          KEYSTORE_STOREPASS: ${{ secrets.KEYSTORE_STOREPASS }}
          KEYSTORE_KEYPASS: ${{ secrets.KEYSTORE_KEYPASS }}

      - name: Create Release and Upload APK
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
          tag_name: v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          generate_release_notes: true
