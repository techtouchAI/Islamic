name: Build and Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'assets/audio/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo "$VERSION" | cut -d '+' -f 1)
          VERSION_CODE=$(echo "$VERSION" | cut -d '+' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install Python dependencies
        run: pip3 install Pillow

      - name: Update App Resources from CMS
        run: python3 scripts/update_resources.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart sources
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Verify bundled Hijri calendar
        run: python3 scripts/verify_hijri_calendar.py

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" > base64_keystore.txt
          base64 -d -i base64_keystore.txt > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "Error: Keystore file is empty or failed to decode!"
            exit 1
          fi
          rm base64_keystore.txt

      - name: Generate key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_STOREPASS }}
          keyPassword=${{ secrets.KEYSTORE_KEYPASS }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Prepare OTA signing key
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_MANIFEST_SIGNING_KEY }}
        run: |
          if [ -n "$OTA_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$OTA_SIGNING_KEY" > "$RUNNER_TEMP/ota-signing.pem"
            openssl pkey -in "$RUNNER_TEMP/ota-signing.pem" -pubout -outform DER \
              | tail -c 32 | base64 -w 0 > "$RUNNER_TEMP/ota-public.b64"
          fi

      - name: Build APK
        run: |
          if [ -f "$RUNNER_TEMP/ota-public.b64" ]; then
            public_key=$(cat "$RUNNER_TEMP/ota-public.b64")
            flutter build apk --release --target-platform android-arm64 \
              --obfuscate --split-debug-info=build/app/outputs/symbols \
              --dart-define="OTA_PUBLIC_KEY_B64=$public_key"
          else
            flutter build apk --release --target-platform android-arm64 \
              --obfuscate --split-debug-info=build/app/outputs/symbols
          fi
        env:
          KEYSTORE_STOREPASS: ${{ secrets.KEYSTORE_STOREPASS }}
          KEYSTORE_KEYPASS: ${{ secrets.KEYSTORE_KEYPASS }}

      # The released APK is verified as packaged, so a stale calendar table
      # can never be shipped even when the source document is correct.
      - name: Verify the calendar inside the APK
        run: |
          python3 scripts/verify_apk_calendar.py \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Sign release manifest
        run: |
          if [ -f "$RUNNER_TEMP/ota-signing.pem" ]; then
            python3 scripts/sign_release_manifest.py \
              --version "$VERSION_NAME" --build "$VERSION_CODE" \
              --min-build "${{ vars.OTA_MIN_SUPPORTED_BUILD || '0' }}" --tag "v${VERSION_NAME}-${VERSION_CODE}" \
              --apk build/app/outputs/flutter-apk/app-release.apk \
              --key "$RUNNER_TEMP/ota-signing.pem" \
              --output build/app/outputs/flutter-apk/release_manifest.json
            rm -f "$RUNNER_TEMP/ota-signing.pem"
          fi

      - name: Create Release and Upload APK
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/release_manifest.json
          name: Release ${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
          tag_name: v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          generate_release_notes: true
