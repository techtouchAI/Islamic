# Temporary diagnostic workflow: turns `dart analyze` output into check-run
# annotations, which are readable through the GitHub API. It is deleted again
# as soon as the lint findings have been addressed.
name: Analyze report (temporary)

on:
  push:
    branches: [arena/01a0f192-islamic]
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze and annotate
        run: |
          dart analyze --format=machine > analyze.txt 2>&1 || true
          cat analyze.txt
          python3 - analyze.txt <<'PY'
          import sys, urllib.parse
          for line in open(sys.argv[1], encoding='utf-8', errors='replace'):
              parts = line.rstrip('\n').split('|')
              if len(parts) < 8 or parts[0] not in ('ERROR', 'WARNING', 'INFO'):
                  continue
              level, kind, code, path, row, col, length, message = parts[:8]
              command = {'ERROR': 'error', 'WARNING': 'warning'}.get(level, 'notice')
              props = f'file={path},line={row},col={col},title={code}'
              print(f'::{command} {props}::{kind}: {message}')
          PY
