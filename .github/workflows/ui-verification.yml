name: UI verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.*'
      - '.github/workflows/ui-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: pip3 install Pillow
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        env:
          CAPTURE_UI: '1'
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/ui-tests.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYTHON'
          import re
          from pathlib import Path
          text = Path('/tmp/ui-tests.log').read_text()
          chunks = re.split(r'(?=══╡ EXCEPTION|\d\d:\d\d .*?\[E\])', text)
          for chunk in chunks:
              if 'EXCEPTION' not in chunk[:100] and '[E]' not in chunk[:300]:
                  continue
              message = chunk[:7000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=UI test failure::' + message)
          PYTHON
          fi
          exit "$result"
      - name: Build web
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-verification-log
          path: |
            /tmp/ui-tests.log
            build/ui-previews/*.png
          if-no-files-found: ignore

      - name: Preview review evidence
        if: always()
        run: |
          python3 - <<'PYTHON'
          import base64
          from pathlib import Path
          from PIL import Image
          images = []
          for path in sorted(Path('build/ui-previews').glob('*.png')):
              image = Image.open(path).convert('RGB')
              image.thumbnail((358, 420))
              images.append(image)
          if images:
              sheet = Image.new('RGB', (sum(im.width for im in images), max(im.height for im in images)), '#123c32')
              x = 0
              for image in images:
                  sheet.paste(image, (x, 0))
                  x += image.width
              import io
              buffer = io.BytesIO()
              sheet.save(buffer, format='WEBP', quality=75)
              data = base64.b64encode(buffer.getvalue()).decode()
              for i in range(0, len(data), 3900):
                  print(f'::notice title=preview-sheet-{i // 3900}::{data[i:i+3900]}')
          PYTHON
